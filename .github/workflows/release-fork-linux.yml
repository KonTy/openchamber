name: Fork Linux release

on:
  push:
    branches: [work-upstream-theme-integration]
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release after validating every asset
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'KonTy/openchamber' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            image_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            image_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and desktop runtime tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl \
            build-essential python3 rpm xz-utils zstd xvfb xauth \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 \
            libsecret-1-0 libnotify4 libxkbcommon0 xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Verify source and native architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: bun install --frozen-lockfile
      - name: Run source gate
        if: matrix.arch == 'x64'
        run: bun run check:changed
      - name: Test and build Linux packages
        working-directory: packages/electron
        run: |
          set -euo pipefail
          bun run test:architecture
          bun run test:updater
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          node scripts/package.mjs --linux --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage
      - name: Validate package metadata and updater manifest
        env:
          IMAGE_ARCH: ${{ matrix.image_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DIST=packages/electron/dist
          DEB="$DIST/OpenChamber-$VERSION-linux-$DEB_ARCH.deb"
          RPM="$DIST/OpenChamber-$VERSION-linux-$RPM_ARCH.rpm"
          test "$(dpkg-deb -f "$DEB" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "$DEB_ARCH"
          test "$(rpm -qp --qf '%{VERSION}' "$RPM")" = "$VERSION"
          test "$(rpm -qp --qf '%{ARCH}' "$RPM")" = "$RPM_ARCH"
          node packages/electron/scripts/verify-update-manifest.mjs \
            "$DIST/$MANIFEST" "$VERSION" \
            "$DIST/OpenChamber-$VERSION-linux-$IMAGE_ARCH.AppImage" "$DEB" "$RPM"
          mkdir release-files
          cp "$DIST/OpenChamber-$VERSION-linux-$IMAGE_ARCH.AppImage" "$DEB" "$RPM" \
            "$DIST/$MANIFEST" release-files/
      - name: Install and exercise the Ubuntu package
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          printf '#!/bin/sh\nexit 0\n' > /usr/bin/openchamber
          chmod 755 /usr/bin/openchamber
          CLI_SHA=$(sha256sum /usr/bin/openchamber)
          apt-get install -y "./packages/electron/dist/OpenChamber-$VERSION-linux-$DEB_ARCH.deb"
          test "$(sha256sum /usr/bin/openchamber)" = "$CLI_SHA"
          xvfb-run -a node packages/electron/scripts/smoke-theme-control.mjs \
            --executable /opt/OpenChamber/openchamber \
            --directory "$RUNNER_TEMP/theme-control" \
            --report "release-files/theme-control-$OPENCHAMBER_TARGET_ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch package and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git gtk3 nss alsa-lib libxss libxtst \
            libnotify xdg-utils libsecret libxkbcommon mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-linux-x64
          path: native
      - name: Build the checksum-pinned Arch package
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node packages/electron/scripts/fork-linux-release.mjs arch-recipe \
            arch-package "$GITHUB_SHA" "native/OpenChamber-$VERSION-linux-amd64.deb"
          cp "native/OpenChamber-$VERSION-linux-amd64.deb" arch-package/
          useradd --create-home builder
          chown -R builder:builder arch-package
          runuser -u builder -- bash -c 'cd "$1" && makepkg --cleanbuild --noconfirm' bash "$PWD/arch-package"
          mkdir release-files
          cp arch-package/PKGBUILD arch-package/LICENSE arch-package/*.pkg.tar.zst release-files/
      - name: Install and exercise the Arch package
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 0\n' > /usr/bin/openchamber
          chmod 755 /usr/bin/openchamber
          CLI_SHA=$(sha256sum /usr/bin/openchamber)
          pacman -U --noconfirm release-files/*.pkg.tar.zst
          test "$(sha256sum /usr/bin/openchamber)" = "$CLI_SHA"
          test "$(cat /opt/OpenChamber/resources/package-type)" = arch
          xvfb-run -a node packages/electron/scripts/smoke-theme-control.mjs \
            --executable /opt/OpenChamber/openchamber \
            --directory "$RUNNER_TEMP/theme-control" \
            --report release-files/theme-control-arch.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-arch
          path: release-files/*
          if-no-files-found: error

  inventory:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fork-linux-*
          merge-multiple: true
          path: release-files
      - name: Verify complete release inventory and write provenance
        run: node packages/electron/scripts/fork-linux-release.mjs verify release-files "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-verified
          path: release-files/*
          if-no-files-found: error

  draft:
    needs: inventory
    if: ${{ github.repository == 'KonTy/openchamber' && github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/work-theme-integration-baseline' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-linux-verified
          path: release-files
      - name: Upload a draft without changing the public update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS
          VERSION=$(jq -r .version provenance.json)
          SOURCE=$(jq -r .sourceCommit provenance.json)
          test "$SOURCE" = "$GITHUB_SHA"
          gh release create "v$VERSION" --draft --target "$SOURCE" \
            --title "OpenChamber $VERSION Linux" \
            --notes "Linux fork build from $SOURCE. Publication awaits Nobara runtime, AppImage update/shutdown and HMR validation." ./*
